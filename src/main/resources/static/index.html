<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Client</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🤖 AI Ассистент</h1>
            <p class="subtitle">Отправьте запрос — получите ответ от нейросети</p>
        </header>

        <div id="chat" class="chat">
            <div class="message bot">
                <div class="bubble">Здравствуйте! Задайте мне любой вопрос.</div>
            </div>
        </div>

        <form id="chatForm" class="input-row">
            <input
                type="text"
                id="messageInput"
                class="input"
                placeholder="Введите ваше сообщение..."
                autocomplete="off"
                required
            >
            <button type="submit" id="sendBtn" class="btn">Отправить</button>
        </form>

        <div id="status" class="status hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
