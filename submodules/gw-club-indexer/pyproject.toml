[project]
name = "gwclub-indexer"
version = "0.1.0"
description = "Indexing pipeline for gw-club-docs: chunking + embeddings + FAISS/SQLite"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu==1.15.1",
    "sentence-transformers>=6.1,<7",
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
gwclub = "gwclub_indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwclub_indexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: long-running tests (real model, real corpus)",
]
