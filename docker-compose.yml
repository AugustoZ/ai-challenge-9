services:
  aiweb:
    build:
      context: .
      dockerfile: Dockerfile
      # Кэш gradle хоста как доп. контекст билда: дистрибутив wrapper'а и
      # maven-зависимости берутся с машины (~/.gradle), а не качаются через
      # прокси Docker, у которого таймаут на services.gradle.org.
      additional_contexts:
        - gradle-host=${HOME}/.gradle
    container_name: aiweb
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Конфиг-файл подключается через bind mount.
    # Контейнер читает config.docker.json — копия config.json с добавленной
    # секцией rag (url -> сервис indexer внутренней сети compose). В хостовом
    # config.json секции rag нет, а дефолт кода (127.0.0.1:18701) внутри
    # контейнера недостижим — без этого RAG падает в fail-open (без блоков).
    #
    # Каталог данных — named volume под P1-персистентность сессий.
    # В P0 каталог /app/data смонтирован, но пуст: сессии живут в памяти
    # (InMemorySessionStore). P1-реализация (файл/SQLite) начнёт писать в
    # AI_DATA_DIR=/app/data без единой правки этого compose-файла.
    volumes:
      - ./config.docker.json:/app/config.json:ro
      - aiweb-data:/app/data
    # Переменные окружения имеют ПРИОРИТЕТ над значениями из config.json.
    # Чтобы использовать только файл config.json — закомментируйте блок environment.
    environment:
      - PORT=8080
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      # tg-сервер и бот переехали в standalone-проект shturman-bot: снапшот
      # TG-БД (./shturman-bot/.tg-db-share) контейнеру больше не нужен —
      # tg_server на хосте запускается config.json из каталога shturman-bot.
    # Две сети (P2): default — интернет для LLM API, sandbox — внутренняя
    # сеть для вызова tool-sandbox (internal: true, без egress).
    networks:
      - default
      - sandbox

  # --- Sandbox для инструментов с эффектами (P2, волна 1) ---
  #
  # НЕ стартует по умолчанию: запуск только вручную —
  #   docker compose --profile sandbox up
  #
  # P2-реализация (PLAN.md, «Sandbox-требования к инструментам»):
  #  - собственный образ (sandbox/Dockerfile): python:3.12-alpine + HTTP-сервер
  #    sandbox/server.py (POST /run — исполнение кода, POST /read — чтение файлов
  #    из /sandbox/workspace), слушает 0.0.0.0:8080 КОНТЕЙНЕРНОЙ сети;
  #  - egress запрещён ЦЕЛИКОМ: сеть sandbox объявлена internal: true —
  #    строжайший «allowlist» (пустой); aiweb при этом сохраняет интернет
  #    через сеть default (LLM API);
  # #  - порты наружу НЕ публикуются, docker socket НЕ монтируется;
 #  - папка хоста (по умолчанию /Users/augustoz/Downloads) монтируется внутрь
 #    workspace как host-files — единственная точка доступа агента к файлам
 #    компьютера: read_file/write_file работают с ней по относительным путям,
 #    изоляция песочницы (non-root, без egress) сохраняется;
  #  - таймаут HTTP-вызова к sandbox — на стороне оркестратора (aiweb);
  #    сервер дополнительно капит таймаут кода на 60 с.
  tool-sandbox:
    profiles: ["sandbox"]
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: tool-sandbox
    user: "65534:65534"          # nobody — non-root
    read_only: true              # корневая ФС только для чтения
    tmpfs: ["/tmp"]              # HOME дочерних процессов — записываемый tmpfs
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # 768 МиБ > RLIMIT_AS 512 МиБ дочернего процесса: контейнерный лимит не
    # должен срабатывать раньше серверного, иначе OOM-убийство вместо
    # контролируемого MemoryError в коде.
    mem_limit: 768m
    pids_limit: 100
    volumes:
      - sandbox-work:/sandbox/workspace
      # Папка хоста внутри workspace: агент читает и пишет файлы компьютера
      # инструментами read_file/write_file по путям вида host-files/<имя>.
      # Путь задаётся переменной HOST_FILES_DIR (.env или окружение); для
      # режима «только чтение» добавьте ":ro" к монтированию.
      # В config.json добавьте "hostDir" в read_file/write_file — тогда модели
      # в описании инструментов будет видно, что host-files — папка хоста.
      - ${HOST_FILES_DIR:-/Users/augustoz/Downloads}:/sandbox/workspace/host-files
    networks:
      - sandbox
    # ports НЕ публикуются — доступ только по внутренней сети sandbox.

  # --- RAG-индексер gw-club (sidecar для aiweb) ---
  #
  # Отдельный репозиторий ../../gw-club-indexer: uv-проект с FAISS-индексом и
  # CPU-реранкером BAAI/bge-reranker-v2-m3. aiweb ходит к нему по внутренней
  # default-сети: http://indexer:8000/search (см. RagClient.kt).
  #
  # Первый запуск: контейнер докачивает веса моделей в hf-cache (~2.7 ГБ:
  # bge-reranker ~2.2 + e5 ~0.5) — до healthy может пройти 10-15 минут
  # (start_period 600s в healthcheck образа).
  indexer:
    build:
      context: ../../gw-club-indexer
      dockerfile: Dockerfile
    container_name: indexer
    # Хост 0.0.0.0 ОБЯЗАТЕЛЕН: serve.py дефолт 127.0.0.1 (serve.py:65) — иначе контейнер молча недоступен
    command: ["uv","run","gwclub","serve","--host","0.0.0.0","--port","8000","--rerank-model","BAAI/bge-reranker-v2-m3"]
    ports:
      # Наружу ТОЛЬКО для отладки с хоста; приложение ходит по внутренней сети (http://indexer:8000/search)
      - "127.0.0.1:18701:8000"
    volumes:
      # Веса моделей (~2.7 ГБ) — именованный том, скачиваются при ПЕРВОМ старте (start_period 600s в healthcheck образа)
      - hf-cache:/home/indexer/.cache/huggingface
      # Готовый FAISS-индекс с хоста (read-only); после ребилда индекса нужен: docker compose restart indexer
      - ../../gw-club-indexer/data/index:/app/data/index:ro
    restart: unless-stopped
    # healthcheck НЕ дублируем: compose автоматически использует HEALTHCHECK из образа
    # (python TCP one-liner, start_period 600s) — см. Dockerfile индексера

# Сети (P2):
#  - default (неявная) — обычная сеть с интернетом: aiweb ходит в LLM API;
#  - sandbox — internal: true: полный запрет egress, доступ только между
#    aiweb и tool-sandbox; у sandbox других сетей нет вовсе.
networks:
  sandbox:
    internal: true

# Named volumes:
#  - aiweb-data: данные сессий (P1-персистентность);
#  - sandbox-work: рабочая папка sandbox — сюда run_code пишет файлы,
#    оттуда read_file их читает; переживает пересоздание контейнера.
#  - hf-cache: HuggingFace-кэш весов моделей индексера (~2.7 ГБ), скачивается
#    при первом старте; переживает пересоздание контейнера.
volumes:
  aiweb-data:
  sandbox-work:
  hf-cache:
